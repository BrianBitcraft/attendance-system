<!DOCTYPE html>
<html>
<head>
<title>Take Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 2.2rem;
    margin-bottom: 10px;
}

.container {
    background: rgba(0,0,0,0.2);
    padding: 25px;
    border-radius: 15px;
    width: 90%;
    max-width: 400px;
}

select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-top: 15px;
    font-size: 1rem;
}

.fingerprint-btn {
    margin-top: 20px;
    width: 120px;
    height: 120px;
    background: url('/static/fingerprint.png') no-repeat center;
    background-size: contain;
    border: none;
    cursor: pointer;
    transition: transform 0.2s;
}

.fingerprint-btn:active {
    transform: scale(1.1);
}

button.submit-btn {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #0b6efd;
    color: white;
    font-size: 1rem;
    cursor: pointer;
}

button.submit-btn:disabled {
    background: gray;
    cursor: not-allowed;
}
</style>
</head>

<body>

<h1>Smart Attendance System</h1>

<div class="container">

<form id="attendanceForm" action="/mark_attendance" method="POST">

    <select name="student_id" id="studentSelect" required>
        <option value="">-- Select Student --</option>
        {% for student in students %}
        <option value="{{ student[0] }}">{{ student[1] }} - {{ student[2] }}</option>
        {% endfor %}
    </select>

    <!-- REAL FINGERPRINT BUTTON (WebAuthn will replace this later) -->
    <button type="button" class="fingerprint-btn" onclick="startFingerprint()"></button>

    <input type="hidden" id="verified" value="false">

    <button type="submit" class="submit-btn" id="submitBtn" disabled>
        Mark Attendance
    </button>

</form>

</div>

<script>
function startFingerprint() {

    const student = document.getElementById("studentSelect").value;

    if (!student) {
        alert("Please select a student first.");
        return;
    }

    // 🔐 This is a placeholder for REAL fingerprint (WebAuthn)
    alert("Place your finger on the device scanner...");

    setTimeout(() => {
        alert("Fingerprint verified successfully!");

        document.getElementById("verified").value = "true";
        document.getElementById("submitBtn").disabled = false;

    }, 1500);
}

// prevent fake submission
document.getElementById("attendanceForm").addEventListener("submit", function(e) {

    if (document.getElementById("verified").value !== "true") {
        e.preventDefault();
        alert("Please verify fingerprint first!");
    }
});
</script>

</body>
</html>
