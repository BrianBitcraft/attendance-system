<!DOCTYPE html>
<html>
<head>
<title>Take Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
<style>
body {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
}

h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 8px rgba(0,0,0,0.3);}
p { margin-bottom: 20px; }

.fingerprint-container {
    width: 200px;
    height: 200px;
    margin: 20px auto;
    background: url('/static/fingerprint.png') no-repeat center center;
    background-size: contain;
    cursor: pointer;
    transition: transform 0.3s;
}

.fingerprint-container:active { transform: scale(1.1); }

select {
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    width: 90%;
    margin-top: 20px;
}

a { color: #fff; margin-top: 20px; display: block; }

@media (max-width: 480px){
    h1 { font-size: 2rem; }
    .fingerprint-container { width: 150px; height: 150px; }
}
</style>
</head>
<body>

<h1>Smartphone Attendance</h1>
<p>Tap the fingerprint to mark attendance</p>

<form id="attendanceForm" action="/mark_attendance" method="POST">
    <select name="student_id" required>
        <option value="">-- Select Student --</option>
        {% for student in students %}
        <option value="{{ student[0] }}">{{ student[1] }} - {{ student[2] }}</option>
        {% endfor %}
    </select>

    <div class="fingerprint-container" onclick="scanFingerprint()"></div>
    <button type="submit">Submit</button>
</form>

<a href="/dashboard">Back to Dashboard</a>

<script>
function scanFingerprint(){
    if(window.innerWidth > 768){
        alert("Attendance can only be marked on smartphones with fingerprint scanner!");
        return;
    }

    if(!document.querySelector("select").value){
        alert("Please select a student first.");
        return;
    }

    alert("Place your finger on the screen to scan...");
    setTimeout(() => {
        alert("Fingerprint verified!");
        document.getElementById("attendanceForm").submit();
    }, 2000);
}
</script>

</body>
</html>
