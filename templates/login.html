<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.9;
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        button {
            padding: 12px 20px;
            border: 2px solid #fff;
            border-radius: 12px;
            font-weight: bold;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: 0.4s;
        }

        button:hover {
            background: #fff;
            color: #4facfe;
            transform: translateY(-3px);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            h3 { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <h1>Student Attendance Management System</h1>
    <h3>Developed by AGNES WAMBUI NYAMBURA</h3>

    <form action="/login" method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>

        <!-- NEW BUTTON GROUP -->
        <div class="btn-group">
            <a href="/register_user">
                <button type="button">Register User</button>
            </a>

            <a href="/attendance">
                <button type="button">Student Attendance</button>
            </a>
        </div>
    </form>

</body>
</html>
