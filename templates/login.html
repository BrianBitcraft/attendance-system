<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        h3 {
            font-size: 1rem;
            margin-bottom: 25px;
            text-align: center;
            opacity: 0.9;
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        button {
            padding: 12px;
            border: 2px solid #fff;
            border-radius: 12px;
            font-weight: bold;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            color: #4facfe;
        }

        .links {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .links a {
            display: block;
            text-align: center;
            padding: 12px;
            border: 2px solid white;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .links a:hover {
            background: white;
            color: #4facfe;
        }
    </style>
</head>

<body>

    <h1>Student Attendance Management System</h1>
    <h3>Developed by AGNES WAMBUI NYAMBURA</h3>

    <!-- LOGIN FORM -->
    <form action="/login" method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <!-- NAVIGATION LINKS -->
    <div class="links">
        <a href="/register_user">Register User</a>
        <a href="/attendance">Student Attendance</a>
    </div>

</body>
</html>
