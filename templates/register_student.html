<!DOCTYPE html>
<html>
<head>
<title>Register Student</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
    text-align: center;
    padding: 20px;
}

h1 { margin-bottom: 10px; }
p { margin-bottom: 20px; }

form {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, button, select {
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
}

button {
    background: #00f2fe;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #4facfe;
}

.fingerprint-btn {
    background: url('/static/fingerprint.png') no-repeat center center;
    background-size: contain;
    height: 150px;
    width: 150px;
    margin: auto;
    cursor: pointer;
    border: none;
}

a { color: #fff; margin-top: 15px; display: block; }
</style>
</head>
<body>

<h1>Register Student</h1>
<p>Student Attendance Management System</p>

<form action="/add_student" method="POST">
    <input type="text" name="name" placeholder="Student Name" required>
    <input type="text" name="reg_number" placeholder="Registration Number" required>
    <input type="email" name="email" placeholder="Parent Email" required>
    
    <button type="button" class="fingerprint-btn" onclick="registerFingerprint()"></button>
    <button type="submit">Register Student</button>
</form>

<a href="/dashboard">Back to Dashboard</a>

<script>
function registerFingerprint(){
    alert("Place finger to register fingerprint...");
    setTimeout(() => alert("Fingerprint registered successfully!"), 2000);
}
</script>

</body>
</html>
