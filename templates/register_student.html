<!DOCTYPE html>
<html>

<head>
    <title>Register Student</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Global Reset & Fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            transition: background 0.5s ease-in-out;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.9;
        }

        /* Form Styling */
        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        button[type="submit"],
        button[type="button"] {
            padding: 12px 20px;
            border: 2px solid #fff;
            border-radius: 12px;
            font-weight: bold;
            background: transparent;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }

        button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-20deg);
            transition: all 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            color: #11998e;
            background-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        /* Back button styling */
        a {
            display: inline-block;
            padding: 12px 25px;
            border: 2px solid #fff;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            margin-top: 15px;
        }

        a::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-20deg);
            transition: all 0.5s;
        }

        a:hover::before {
            left: 100%;
        }

        a:hover {
            color: #11998e;
            background-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            p {
                font-size: 1rem;
            }

            form {
                padding: 20px;
            }

            input[type="text"],
            input[type="email"],
            button,
            a {
                font-size: 0.9rem;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 0.9rem;
            }

            form {
                gap: 12px;
            }

            input[type="text"],
            input[type="email"],
            button,
            a {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>

    <h1>Register Student</h1>
    <p>Student Attendance Management System</p>
    <p>Developed by AGNES NYAMBURA</p>

    <form action="/add_student" method="POST">

        <label>Student Name</label><br>
        <input type="text" name="name" required><br><br>

        <label>Registration Number</label><br>
        <input type="text" name="reg_number" required><br><br>

        <!-- Parent Email Input -->
        <label>Parent Email</label><br>
        <input type="email" name="email" required><br><br>

        <!-- Register Fingerprint Button -->
        <button type="button" onclick="registerFingerprint()">Register Fingerprint</button><br>

        <button type="submit">Register Student</button>

    </form>

    <br>
    <a href="/dashboard">Back to Dashboard</a>

    <script>
        function registerFingerprint() {
            alert("Place finger to register fingerprint...");
            setTimeout(function () {
                alert("Fingerprint registered successfully!");
            }, 2000);
        }
    </script>

</body>

</html>
