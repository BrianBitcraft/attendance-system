<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Global Reset & Fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease-in-out;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
            opacity: 0.9;
        }

        /* Navigation styling */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        nav a {
            display: inline-block;
            padding: 12px 20px;
            border: 2px solid #fff;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }

        /* Button hover animation */
        nav a::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-20deg);
            transition: all 0.5s;
        }

        nav a:hover::before {
            left: 100%;
        }

        nav a:hover {
            color: #6a11cb;
            background-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            h3 {
                font-size: 1.2rem;
            }

            nav a {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            h3 {
                font-size: 1rem;
            }

            nav {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>Dashboard</h1>

    <h3>Student Attendance Management System</h3>

    <p>Developed by AGNES NYAMBURA</p>

    <br>

    <!-- Navigation Links -->
    <nav>
        <a href="/dashboard">Dashboard</a> |
        <a href="/register_user">New User</a> |
        <a href="/register">New Student</a> |
        <a href="/students">View Students</a> |
        <a href="/attendance">Take Attendance</a> |
        <a href="/attendance_report">Attendance Report</a> |
        <a href="/logout">Logout</a>
    </nav>

    <br><br>

</body>

</html>
