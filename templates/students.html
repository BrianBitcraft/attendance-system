<!DOCTYPE html>
<html>

<head>
    <title>Students List</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Global Reset & Fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease-in-out;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.9;
        }

        /* Table Styling */
        table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        /* Back button styling */
        a {
            display: inline-block;
            padding: 12px 25px;
            border: 2px solid #fff;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            margin-top: 15px;
        }

        a::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-20deg);
            transition: all 0.5s;
        }

        a:hover::before {
            left: 100%;
        }

        a:hover {
            color: #6a11cb;
            background-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            p {
                font-size: 1rem;
            }

            table {
                font-size: 0.9rem;
            }

            a {
                font-size: 0.9rem;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 0.9rem;
            }

            table {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <h1>Registered Students</h1>

    <p>Student Attendance Management System</p>
    <p>Developed by AGNES NYAMBURAs</p>

    <br>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Registration Number</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{student[0]}}</td>
            <td>{{student[1]}}</td>
            <td>{{student[2]}}</td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>

</html>
